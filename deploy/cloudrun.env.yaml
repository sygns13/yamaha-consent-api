# Variables de entorno de Cloud Run (no secretas) para: gcloud run deploy ... --env-vars-file deploy/cloudrun.env.yaml
#
# - Reemplazar los valores <...> antes de desplegar. Todos los valores van entre comillas (strings).
# - --env-vars-file REEMPLAZA todas las variables del servicio: este archivo debe estar completo.
# - Los secretos NO van aquí: DATABASE_URL, API_KEY, TWILIO_AUTH_TOKEN y KIZUNA_CALLBACK_AUTH_VALUE se montan desde
#   Secret Manager con --set-secrets (una variable no puede estar a la vez aquí y en --set-secrets).
# - Descripción de cada variable: sección 9 de REQUERIMIENTOS_TECNICOS.md y .env.example.

# --- General ---
APP_ENV: "production"
LOG_LEVEL: "INFO"
DOCS_ENABLED: "true"                      # PENDIENTE-12: ¿se deja /docs expuesto en Producción?

# --- Seguridad (endpoints de KIZUNA) ---
API_KEY_ENABLED: "true"                   # con true, API_KEY (secreto) es obligatoria o la app no arranca
API_KEY_HEADER: "X-API-Key"
CORS_ALLOWED_ORIGINS: "https://<DOMINIO_LANDING>"   # PENDIENTE-15; lista separada por comas

# --- Enlaces y landing ---
LINK_TTL_HOURS: "168"
LANDING_BASE_URL: "https://<DOMINIO_LANDING>"       # PENDIENTE-15
PRIVACY_POLICY_URL: "<URL_POLITICA_PRIVACIDAD>"     # PENDIENTE-14
PRIVACY_POLICY_VERSION: "v1"

# --- Twilio WhatsApp ---
# true solo cuando la plantilla esté aprobada por Meta y TWILIO_CONTENT_SID definido (PENDIENTE-07 y 15). Con true y datos
# incompletos la app no arranca.
TWILIO_SEND_ENABLED: "false"
TWILIO_ACCOUNT_SID: "<ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx>"
TWILIO_WHATSAPP_FROM: "whatsapp:+<NUMERO_NUEVO_Y_EXCLUSIVO>"
TWILIO_CONTENT_SID: "<HXxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx>"
# La URL de Cloud Run se conoce después del primer deploy (paso 5 del README).
TWILIO_STATUS_CALLBACK_URL: "https://<URL_CLOUD_RUN>/api/v1/webhooks/twilio/status"
TWILIO_SIGNATURE_VALIDATION_ENABLED: "true"
TWILIO_TIMEOUT_SECONDS: "10"
PHONE_COUNTRY_PREFIX: "51"

# --- Notificación a KIZUNA (PENDIENTE-13) ---
# false hasta tener el endpoint real de KIZUNA y su contrato confirmado (M7, paso 5). Con true, KIZUNA_CALLBACK_URL es
# obligatoria, y si se define KIZUNA_CALLBACK_AUTH_HEADER también el secreto KIZUNA_CALLBACK_AUTH_VALUE.
KIZUNA_CALLBACK_ENABLED: "false"
KIZUNA_CALLBACK_URL: ""
KIZUNA_CALLBACK_AUTH_HEADER: ""
KIZUNA_CALLBACK_MAX_RETRIES: "3"
KIZUNA_CALLBACK_BACKOFF_SECONDS: "5,30,120"
KIZUNA_CALLBACK_TIMEOUT_SECONDS: "10"
KIZUNA_CALLBACK_REPROCESS_AFTER_MINUTES: "10"
