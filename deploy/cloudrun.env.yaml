# Variables de entorno de Cloud Run (no secretas) para: gcloud run deploy ... --env-vars-file deploy/cloudrun.env.yaml
#
# - Reemplazar los valores <...> antes de desplegar. Todos los valores van entre comillas (strings).
# - --env-vars-file REEMPLAZA todas las variables del servicio: este archivo debe estar completo.
# - Es el archivo del servicio público consent-api. El del servicio privado de KIZUNA (consent-api-kizuna) se GENERA
#   desde este con: uv run python -m scripts.kizuna_env  (→ deploy/cloudrun-kizuna.env.yaml, ignorado por git).
#   Regenéralo después de cada cambio aquí: los dos servicios llevan las mismas variables salvo API_SURFACE y
#   KIZUNA_INBOUND_AUTH (INTEGRACION_KIZUNA_CLOUD_RUN_IAM.spec.md, sección 4.4).
# - Los secretos NO van aquí: DATABASE_URL, API_KEY, TWILIO_AUTH_TOKEN, KIZUNA_CALLBACK_AUTH_VALUE,
#   KIZUNA_OAUTH_CLIENT_SECRET y SMTP_PASSWORD se montan desde Secret Manager con --set-secrets (una variable no puede estar a la vez aquí y en --set-secrets).
#   En Producción no se crea API_KEY (KIZUNA entra por Cloud Run IAM).
# - Descripción de cada variable: sección 9 de REQUERIMIENTOS_TECNICOS.md, sección 9.1 de BACKOFFICE_DEALERS.spec.md
#   y .env.example.

# --- General ---
APP_ENV: "production"
LOG_LEVEL: "INFO"
DOCS_ENABLED: "true"                      # PENDIENTE-12: ¿se deja /docs expuesto en Producción?

# --- Endpoints expuestos y autenticación de KIZUNA (INTEGRACION_KIZUNA_CLOUD_RUN_IAM.spec.md) ---
API_SURFACE: "public"                     # consent-api: sin los endpoints de KIZUNA (el archivo generado: "kizuna")
KIZUNA_INBOUND_AUTH: "api_key"            # no se usa en consent-api (el archivo generado: "cloud_run_iam")
# Las usa solo consent-api-kizuna (verificación del ID token en la API). Reemplazar <PROJECT_ID> en la copia local.
KIZUNA_ID_TOKEN_AUDIENCES: "consent-api-kizuna.<PROJECT_ID>"   # = --add-custom-audiences del servicio privado
KIZUNA_ID_TOKEN_EMAIL: "kizuna-caller@<PROJECT_ID>.iam.gserviceaccount.com"

# --- Seguridad (endpoints de KIZUNA) ---
# Se queda en "true" como protección: si un servicio quedara con API_SURFACE=all, sin el secreto API_KEY no arranca.
API_KEY_ENABLED: "true"
API_KEY_HEADER: "X-API-Key"
CORS_ALLOWED_ORIGINS: "https://<DOMINIO_LANDING>"   # PENDIENTE-15; lista separada por comas

# --- Enlaces y landing ---
LINK_TTL_HOURS: "168"
LANDING_BASE_URL: "https://<DOMINIO_LANDING>"       # PENDIENTE-15
PRIVACY_POLICY_URL: "<URL_POLITICA_PRIVACIDAD>"     # PENDIENTE-14
PRIVACY_POLICY_VERSION: "v1"

# --- Twilio WhatsApp ---
# true solo cuando la plantilla esté aprobada por Meta y TWILIO_CONTENT_SID definido (PENDIENTE-07 y 15). Con true y datos
# incompletos la app no arranca.
TWILIO_SEND_ENABLED: "false"
TWILIO_ACCOUNT_SID: "<ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx>"
TWILIO_WHATSAPP_FROM: "whatsapp:+<NUMERO_NUEVO_Y_EXCLUSIVO>"
TWILIO_CONTENT_SID: "<HXxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx>"
# La URL de Cloud Run se conoce después del primer deploy (paso 5 del README).
TWILIO_STATUS_CALLBACK_URL: "https://<URL_CLOUD_RUN>/api/v1/webhooks/twilio/status"
TWILIO_SIGNATURE_VALIDATION_ENABLED: "true"
TWILIO_TIMEOUT_SECONDS: "10"
PHONE_COUNTRY_PREFIX: "51"

# --- Notificación a KIZUNA (PENDIENTE-27: URL y respuesta) ---
# false hasta tener el endpoint real de KIZUNA y su contrato confirmado (M7, paso 5). Con true, KIZUNA_CALLBACK_URL es
# obligatoria (https en Producción).
KIZUNA_CALLBACK_ENABLED: "false"
KIZUNA_CALLBACK_URL: ""
# Producción: oauth2 contra el Entra ID de KIZUNA (INTEGRACION_KIZUNA_OAUTH2.spec.md). Con true, el token URL (https),
# el client_id, el scope y el secreto KIZUNA_OAUTH_CLIENT_SECRET son obligatorios, y KIZUNA_CALLBACK_AUTH_HEADER
# queda vacío.
KIZUNA_CALLBACK_AUTH_MODE: "oauth2"
KIZUNA_CALLBACK_AUTH_HEADER: ""
KIZUNA_OAUTH_TOKEN_URL: ""                 # PENDIENTE-26: https://login.microsoftonline.com/<TENANT_ID>/oauth2/v2.0/token
KIZUNA_OAUTH_CLIENT_ID: ""                 # PENDIENTE-26
KIZUNA_OAUTH_SCOPE: ""                     # PENDIENTE-26: https://<entorno-d365>/.default
KIZUNA_OAUTH_CLIENT_AUTH_METHOD: "client_secret_post"
KIZUNA_OAUTH_REFRESH_MARGIN_SECONDS: "300"
KIZUNA_CALLBACK_MAX_RETRIES: "3"
KIZUNA_CALLBACK_BACKOFF_SECONDS: "5,30,120"
KIZUNA_CALLBACK_TIMEOUT_SECONDS: "10"
KIZUNA_CALLBACK_REPROCESS_AFTER_MINUTES: "10"
KIZUNA_TIMEZONE: "America/Lima"

# --- BackOffice (sección 9.1 de BACKOFFICE_DEALERS.spec.md) ---
# PENDIENTE-18: mientras no haya dominio propio, la URL técnica de Firebase Hosting (https://<sitio>.web.app).
BACKOFFICE_BASE_URL: "https://<DOMINIO_BACKOFFICE>"
BACKOFFICE_SESSION_COOKIE_SECURE: "true"          # con APP_ENV=production y "false" la app no arranca
BACKOFFICE_SESSION_IDLE_MINUTES: "30"
BACKOFFICE_SESSION_MAX_HOURS: "12"
BACKOFFICE_LOGIN_MAX_FAILED_ATTEMPTS: "5"
BACKOFFICE_LOGIN_LOCK_MINUTES: "15"
BACKOFFICE_PASSWORD_MIN_LENGTH: "8"
BACKOFFICE_PASSWORD_RESET_TTL_MINUTES: "30"
BACKOFFICE_PASSWORD_RESET_MAX_PER_HOUR: "3"

# --- Correo del BackOffice (SMTP de Gmail, sección 7.5) ---
# "true" solo cuando exista el secreto SMTP_PASSWORD (contraseña de aplicación de Gmail) y se agregue a --set-secrets.
EMAIL_SEND_ENABLED: "false"
EMAIL_FROM_ADDRESS: "construyendosolucionesbcs@gmail.com"   # Gmail exige el remitente de la propia cuenta
EMAIL_FROM_NAME: "BackOffice Consentimientos Yamaha"
SMTP_HOST: "smtp.gmail.com"
SMTP_PORT: "587"
SMTP_SECURITY: "starttls"
SMTP_USERNAME: "construyendosolucionesbcs@gmail.com"
SMTP_TIMEOUT_SECONDS: "10"
