# Entorno local (M0). No se usa en Producción.
#
#   docker compose up                  → PostgreSQL 16 + mock de KIZUNA + Mailpit (la API se levanta con uv en el host)
#   docker compose --profile api up    → además, la API en un contenedor (http://localhost:8000)
#
# Mailpit captura los correos del BackOffice: SMTP en localhost:1025, bandeja en http://localhost:8025.
#
# Las credenciales y el puerto de PostgreSQL deben coincidir con DATABASE_URL del .env.
# Se pueden cambiar sin editar este archivo: POSTGRES_PORT=5434 docker compose up

services:
  postgres:
    # Versión fija (no 16-alpine) para que todos levanten la misma imagen.
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-consents_db}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  kizuna-mock:
    build: ./mocks/kizuna_mock
    environment:
      MOCK_FAIL_TIMES: ${MOCK_FAIL_TIMES:-0}
      MOCK_RESPONSE_DELAY_SECONDS: ${MOCK_RESPONSE_DELAY_SECONDS:-0}
      # OAuth 2.0 (INTEGRACION_KIZUNA_OAUTH2.spec.md, sección 6): token endpoint POST /kizuna/oauth/token.
      MOCK_REQUIRE_AUTH: ${MOCK_REQUIRE_AUTH:-false}
      MOCK_CLIENT_ID: ${MOCK_CLIENT_ID:-mock-client}
      MOCK_CLIENT_SECRET: ${MOCK_CLIENT_SECRET:-mock-secret}
      MOCK_TOKEN_EXPIRES_IN: ${MOCK_TOKEN_EXPIRES_IN:-3600}
      MOCK_TOKEN_FAIL_TIMES: ${MOCK_TOKEN_FAIL_TIMES:-0}
    ports:
      - "${KIZUNA_MOCK_PORT:-8081}:8081"

  mailpit:
    # SMTP de pruebas del BackOffice (sección 7.5 del spec del BackOffice). Versión fija.
    image: axllent/mailpit:v1.33.1
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  api:
    profiles: ["api"]
    build: .
    env_file: .env
    environment:
      # Dentro de la red de compose los servicios se llaman por su nombre.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@postgres:5432/${POSTGRES_DB:-consents_db}
      KIZUNA_CALLBACK_URL: http://kizuna-mock:8081/kizuna/consent-result
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      PORT: "8000"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kizuna-mock:
        condition: service_started
      mailpit:
        condition: service_started

volumes:
  postgres-data:
